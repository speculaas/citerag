<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>citerag</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="header">
    <h1>citerag</h1>
    <span class="subtitle">graph-native citation reader</span>
  </div>
  <div id="app">
    <div id="library-strip" aria-label="Library"></div>
    <div id="viewport">
      <div id="paper-meta">
        <p class="loading">Loading…</p>
      </div>
    </div>

    <div id="feed-panel">
      <div id="feed-panel-header">
        References &amp; cited-by
        <button id="graph-toggle" class="graph-toggle-btn" title="Toggle citation graph">Graph</button>
      </div>
      <div id="graph-panel" aria-label="Citation graph">
        <div class="graph-block">
          <div class="graph-block-label">References ↓ (focus cites these)</div>
          <canvas id="graph-references"></canvas>
        </div>
        <div class="graph-block">
          <div class="graph-block-label">Cited by ↑ (these cite focus)</div>
          <canvas id="graph-cited-by"></canvas>
        </div>
      </div>
      <div id="feed" aria-live="polite"></div>

      <div class="feed-form">
        <h3>Add reference (this paper cites another)</h3>
        <input class="ref-id"     placeholder="other paper id, e.g. arxiv-1706.03762">
        <input class="ref-title"  placeholder="title (optional)">
        <input class="ref-url"    placeholder="url (optional)">
        <input class="ref-anchor" placeholder="anchor passage (optional)">
        <button data-add="reference">Add reference</button>
      </div>

      <div class="feed-form">
        <h3>Add cited-by (another paper cites this one)</h3>
        <input class="cb-id"     placeholder="other paper id">
        <input class="cb-title"  placeholder="title (optional)">
        <input class="cb-url"    placeholder="url (optional)">
        <input class="cb-anchor" placeholder="anchor passage (optional)">
        <button data-add="cited_by">Add cited-by</button>
      </div>
    </div>
  </div>
  <script src="graph.js"></script>
  <script src="viewer.js"></script>
</body>
</html>
